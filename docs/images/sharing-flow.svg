<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title description">
  <title id="title">Your files. One private link.</title>
  <desc id="description">A host shares selected files and a live whitepad through an HTTPS tunnel. A receiver opens a private link in a browser to download files and copy text.</desc>
  <rect width="960" height="260" rx="16" fill="#f6f4ed"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="32" y="42" fill="#213e3b" font-size="23" font-weight="700">Your files. One private link.</text>
    <text x="32" y="67" fill="#6d756e" font-size="14">Share from your computer. Open in any browser.</text>
    <rect x="32" y="94" width="256" height="126" rx="10" fill="#183e3c"/>
    <g fill="none" stroke="#ed7855" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="52" y="115" width="32" height="23" rx="3"/>
      <path d="M48 144h40m-20-6v6"/>
    </g>
    <text x="101" y="135" fill="#f6f4ed" font-size="18" font-weight="700">Host</text>
    <text x="52" y="168" fill="#e8eee0" font-size="14">Selected files + live whitepad</text>
    <text x="52" y="194" fill="#a5bdb0" font-size="12">Run locally. Keep originals here.</text>
    <path d="M304 156h62m-7-6 7 6-7 6M588 156h62m-7-6 7 6-7 6" fill="none" stroke="#2d6756" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="382" y="119" width="190" height="75" rx="10" fill="#e9ece3" stroke="#cbd0c3"/>
    <text x="477" y="149" fill="#213e3b" font-size="16" font-weight="700" text-anchor="middle">HTTPS tunnel</text>
    <text x="477" y="174" fill="#6d756e" font-size="12" text-anchor="middle">Your provider relays traffic</text>
    <rect x="666" y="94" width="262" height="126" rx="10" fill="#fffdf8" stroke="#cbd0c3"/>
    <g fill="none" stroke="#2d6756" stroke-width="2" stroke-linecap="round">
      <rect x="686" y="113" width="32" height="29" rx="3"/>
      <path d="M686 122h32"/>
    </g>
    <circle cx="691" cy="118" r="1" fill="#ed7855"/>
    <text x="735" y="135" fill="#213e3b" font-size="18" font-weight="700">Receiver</text>
    <text x="686" y="168" fill="#213e3b" font-size="14">Download files. Copy text.</text>
    <text x="686" y="194" fill="#6d756e" font-size="12">Open the link. Nothing to install.</text>
    <text x="480" y="242" fill="#6d756e" font-size="12" text-anchor="middle">Private-link access / Read-only receivers / Live updates</text>
  </g>
</svg>
